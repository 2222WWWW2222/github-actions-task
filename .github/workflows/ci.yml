name: Node.js CI/CD to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантаження коду репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Встановлення Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Встановлення залежностей та білд
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # 4. Налаштування SSH-ключа з GitHub Secrets
      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      # 5. Копіювання файлів на EC2-сервер через rsync
      - name: Copy files to EC2
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -i ec2-key.pem" ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/nodeapp/

      # 6. Запуск/перезапуск застосунку на сервері
      - name: Run app on EC2
        run: |
          ssh -i ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            sudo apt-get update -y
            # Встановлюємо Node.js, якщо він ще не встановлений
            if ! command -v node &> /dev/null; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
            fi
            # Встановлюємо менеджер процесів PM2 глобально, якщо потрібно
            if ! command -v pm2 &> /dev/null; then
                sudo npm install -g pm2
            fi
            
            cd /home/ubuntu/nodeapp
            npm install
            pm2 restart all || pm2 start index.js --name "nodeapp"
          EOF
