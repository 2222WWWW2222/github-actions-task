name: CI/CD Docker & Compose to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Отримуємо короткий хеш коміту для використання як тегу
      - name: Get Git Commit Hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Авторизація в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Збірка та публікація Docker-образу з тегом-хешем коміту
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nodeapp:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/nodeapp:${{ steps.vars.outputs.sha_short }}

      # Налаштування SSH-ключа для підключення до AWS EC2
      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      # Копіювання файлів проєкту та docker-compose.yml на сервер
      - name: Copy files to EC2
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -i ec2-key.pem" ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/nodeapp/

      # Очищення старих процесів (видаляємо PM2 з попередніх завдань, якщо він залишився) та запуск через Docker Compose
      - name: Run app on EC2 via Docker Compose
        run: |
          ssh -i ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Повне очищення старого pm2 та контейнерів
            sudo npm uninstall -g pm2 || true
            docker rm -f nodeapp || true
            
            cd /home/ubuntu/nodeapp
            
            # Експортуємо тег поточного коміту для використання в docker-compose.yml
            export IMAGE_TAG=${{ steps.vars.outputs.sha_short }}
            
            # Авторизація на серверах Docker Hub (якщо потрібно для приватних, для публічних можна пропустити)
            # Зупиняємо старі сервіси та запускаємо нові в фоні
            docker-compose down
            docker-compose pull
            docker-compose up -d
          EOF
