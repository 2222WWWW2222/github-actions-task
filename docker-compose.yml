version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  app:
    image: ${{secrets.DOCKER_HUB_USERNAME}}/nodeapp:${{env.IMAGE_TAG}}
    # Для локального тестування можна використати build: . замість image
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://myuser:mypassword@db:5432/mydb
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
